[package]
name = "tiff_to_dicom"
version = "0.1.1"
edition = "2024"

[dependencies]
dicom-core = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-object = "0.10.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg"] }
image = { version = "0.25.10", features = ["tiff"] }
rfd = "0.17.2"
wasm-bindgen-futures = "0.4.76"
web-sys = "0.3.103"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-file = "0.3"

